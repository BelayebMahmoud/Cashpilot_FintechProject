name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret!
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://cashpilot:cashpilot@localhost:5432/cashpilot
  APP_TIMEZONE: Africa/Tunis

jobs:
  verify:
    name: Lint · typecheck · test · build · depcruise
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Infra tests use Testcontainers (Docker is available on ubuntu-latest runners)
      - run: pnpm turbo run lint typecheck test build

      - name: Dependency rule (clean architecture)
        run: pnpm depcruise

  e2e:
    name: Playwright (defense scenario, permissions, mobile, a11y)
    needs: verify
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cashpilot/web exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@cashpilot/web
      # The E2E server runs in DEMO_IN_MEMORY mode (seeded at boot), see apps/web/playwright.config.ts
      - run: pnpm --filter @cashpilot/web test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
